<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RV64 シミュレータ — 実践・Cコンパイラ演習</title>
    <script type="module" crossorigin src="./assets/sim-D9IaOEUg.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/style-wwbA0nvi.js">
    <link rel="stylesheet" crossorigin href="./assets/style-CANjKHsX.css">
  </head>
  <body>
    <!-- ヘッダと操作列は常に画面内に残す（style.css の #sim-head を参照） -->
    <div id="sim-head">
      <header id="topbar">
        <h1>RV64 シミュレータ</h1>
        <nav id="app-nav"></nav>
        <label id="example-label">
          プリセット:
          <select id="example-select"></select>
        </label>
        <span id="font-buttons">
          文字:
          <button data-size="m" class="active">標準</button>
          <button data-size="l">大</button>
          <button data-size="xl">特大</button>
        </span>
      </header>

      <div id="toolbar">
        <button id="btn-reset" title="最初から">⟲ 最初へ</button>
        <button id="btn-back" title="1命令もどる">◀ もどる</button>
        <button id="btn-step" title="1命令すすむ">▶ すすむ</button>
        <button id="btn-run" title="停止するまで実行">▶▶ 実行</button>
        <button id="btn-stop" title="実行を止める" hidden>■ 停止</button>
        <span class="spacer"></span>
        <span id="counters">
          実行した命令 <b id="step-count">0</b>
          <span id="exit-box" hidden>／ 終了コード <b id="exit-code">-</b></span>
        </span>
      </div>
    </div>

    <main id="sim-layout">
      <section id="asm-pane">
        <div class="pane-head">
          <span>アセンブリ</span>
          <span class="pane-note">行番号をクリックするとブレークポイント</span>
          <button id="btn-edit">貼り替える</button>
        </div>
        <div id="asm-view"></div>
        <div id="asm-editor" hidden>
          <textarea
            id="asm-input"
            spellcheck="false"
            placeholder="python3 mycc.py test.c の出力を貼り付ける（ファイルをドロップしてもよい）"
          ></textarea>
          <div class="editor-actions">
            <button id="btn-load">読み込む</button>
            <button id="btn-cancel">やめる</button>
          </div>
        </div>
        <div id="asm-error" hidden></div>
      </section>

      <section id="state-pane">
        <div id="warnings" hidden>
          <h3>気づいたこと</h3>
          <ul id="warning-list"></ul>
          <p class="pane-note">
            症状の意味は
            <a href="../docs/debugging.md" target="_blank" rel="noreferrer">debugging.md</a>
            にある
          </p>
        </div>

        <div class="state-block">
          <h3>レジスタ</h3>
          <table id="reg-table"><tbody id="reg-body"></tbody></table>
        </div>

        <div class="state-block">
          <h3>スタック <span class="pane-note">上が高いアドレス</span></h3>
          <table id="stack-table"><tbody id="stack-body"></tbody></table>
        </div>

        <div class="state-block" id="data-block">
          <h3>データ領域</h3>
          <table id="data-table"><tbody id="data-body"></tbody></table>
        </div>

        <div class="state-block">
          <h3>標準出力</h3>
          <pre id="stdout-pre"></pre>
        </div>
      </section>
    </main>

  </body>
</html>
