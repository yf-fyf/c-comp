<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AST ビジュアライザ — 実践・Cコンパイラ演習</title>
    <!-- OCaml コア（js_of_ocaml 出力）。globalThis.myccCore を定義する -->
    <script src="./core/api.bc.js"></script>
  </head>
  <body>
    <header id="topbar">
      <h1>AST ビジュアライザ</h1>
      <nav id="app-nav"></nav>
      <label id="example-label">
        プリセット:
        <select id="example-select"></select>
      </label>
      <span id="font-buttons">
        文字:
        <button data-size="m" class="active">標準</button>
        <button data-size="l">大</button>
        <button data-size="xl">特大</button>
      </span>
    </header>
    <main id="layout">
      <section id="left">
        <div id="editor"></div>
        <div id="status"></div>
      </section>
      <section id="right">
        <nav id="tabs">
          <button data-tab="tree" class="active">AST 木</button>
          <button data-tab="tokens">トークン</button>
          <button data-tab="sexp">S 式</button>
          <label id="opt-line-label"><input type="checkbox" id="opt-show-line" /> 行番号</label>
        </nav>
        <div id="pane-tree" class="pane active">
          <svg id="tree-svg" role="tree" aria-label="抽象構文木"></svg>
          <p class="hint">hoverで対応箇所を確認、クリックで固定。ノード左上の + / − で部分木を開閉。⇄ は比較演算子の正規化（&gt; / &gt;= は lt / le に入れ替え）</p>
        </div>
        <div id="pane-tokens" class="pane">
          <table id="token-table">
            <thead><tr><th>行</th><th>種別</th><th>字句</th></tr></thead>
            <tbody id="token-body"></tbody>
          </table>
        </div>
        <div id="pane-sexp" class="pane"><pre id="sexp-pre"></pre></div>
      </section>
    </main>
    <script type="module" src="/src/ast-main.ts"></script>
  </body>
</html>
