name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check Python sources
        run: python3 -m compileall -q tools workbook/scaffold
      - name: Parse a representative learner program
        run: python3 workbook/scaffold/parse_viewer.py workbook/sessions/02_interpreter/tests/add_mul.c >/dev/null

  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install pandoc and PyYAML
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc python3-yaml
      - name: Show the pandoc version
        # ディストリの pandoc は手元より古いことがある。差分の切り分け用に出す
        run: pandoc --version | head -1
      - name: Build the site
        run: make site
      - name: Check internal links
        run: make check-links
      - name: Check documentation consistency
        run: make check-docs

  web-app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.1
      - name: Install OCaml dependencies
        run: opam install -y dune menhir js_of_ocaml js_of_ocaml-ppx
      - name: Build web application and presets
        run: opam exec -- make web
      - name: Type-check web application
        run: npm run typecheck
        working-directory: web/app
      - name: Test web application
        run: opam exec -- make web-test
