# サイト構成の単一の出典。
#
# tools/build_site.py がこのファイルを読んで、全ページの HTML・上部メニュー・
# 前後ナビ・トップページを生成する。教材を追加・改名したときはここに1行足す。
#
# 各ページのタイトルは原稿の先頭 H1 から取るので、ここには書かない。
# 出力先は <section slug>/<原稿の stem>/index.html。
# stem が README のものだけは <section slug>/index.html（セクションの入口）になる。

title: 実践・C コンパイラ演習
description: C 言語サブセットのコンパイラを段階的に作る演習教材。RISC-V RV64 を qemu で動かす。
base_url: https://yf-fyf.github.io/c-comp/
repo_url: https://github.com/yf-fyf/c-comp
repo_branch: dev

# サイト内に無い Markdown へのリンクは repo_url/blob/repo_branch/<path> へ逃がす。

# group は上部メニューの群分け。group が変わる位置に区切り線が入る
# （「教材｜引くもの｜道具」の3群に見せる）。

sections:
  - slug: sessions
    title: 通常回
    group: 教材
    summary: 先頭は番号を持たない準備回のコマ0（演習環境構築）で、初回授業の開始時点で終わっているのが目標である。続くコマ1〜15 の15コマが通常回の本体で、授業内では読解と着手までを行い、実装の完成は次回までの課題とする粒度に分けてある。末尾は自身の取り組みを発表する発表会（コマ16）で、これも通常回には含めない別枠である。準備のコマ0 と発表会のコマ16 は、進度に応じて指導する回のため資料は最小限にとどめてある。
    pages:
      - materials/sessions/00_setup.md
      - materials/sessions/01_interpreter.md
      - materials/sessions/02_arithmetic_codegen.md
      - materials/sessions/03_variables.md
      - materials/sessions/04_if_else.md
      - materials/sessions/05_loops.md
      - materials/sessions/06_functions_recursion.md
      - materials/sessions/07_lvalue_rvalue.md
      - materials/sessions/08_types.md
      - materials/sessions/09_pointer_arith.md
      - materials/sessions/10_strings_data_section.md
      - materials/sessions/11_expr_walk_libc.md
      - materials/sessions/12_struct_malloc_list.md
      - materials/sessions/13_globals_scope.md
      - materials/sessions/14_preprocess_multifile.md
      - materials/sessions/15_integrate_mycc.md
      - materials/sessions/16_demo_review.md

  - slug: advanced
    title: 発展課題
    group: 教材
    summary: 選択制の26トピック。回 ID の頭文字がカテゴリを表す。
    pages:
      - workbook/advanced/README.md
      - materials/advanced/F0_cyk.md
      - materials/advanced/F1_lexer.md
      - materials/advanced/F2_parser_expr.md
      - materials/advanced/F3_parser_stmt.md
      - materials/advanced/F4_parser_decl.md
      - materials/advanced/B1_fold_peephole.md
      - materials/advanced/B2_regalloc.md
      - materials/advanced/B3_tailcall.md
      - materials/advanced/O1_measure.md
      - materials/advanced/O2_cfg.md
      - materials/advanced/O3_isel.md
      - materials/advanced/O4_regalloc.md
      - materials/advanced/O5_liveness.md
      - materials/advanced/O6_copyprop.md
      - materials/advanced/O7_layout.md
      - materials/advanced/R1_nolibc.md
      - materials/advanced/R2_printf.md
      - materials/advanced/R3_malloc.md
      - materials/advanced/S1_shortcircuit.md
      - materials/advanced/S2_int32.md
      - materials/advanced/S3_struct.md
      - materials/advanced/L1_ptrdiff.md
      - materials/advanced/L2_compound_assign.md
      - materials/advanced/L3_variadic.md
      - materials/advanced/L4_sizeof_expr.md
      - materials/advanced/L5_struct_byval.md
      - materials/advanced/Q1_typecheck.md
      - materials/advanced/P1_selfhost.md

  - slug: docs
    title: 仕様・参考文書
    group: 引くもの
    summary: 知りたいことから引く索引と、仕様・参考文書の本体。
    # 並びは「読むもの」→「引くもの」の順。前後ナビがセクション内に閉じるので、
    # この並びがそのまま読む順序の弱い示唆になる。
    pages:
      - workbook/docs/README.md
      - workbook/docs/getting_started.md
      - workbook/docs/conventions.md
      - workbook/docs/testing.md
      - workbook/docs/language_spec.md
      - workbook/docs/rv64_reference.md
      - workbook/docs/code_example.md

  - slug: guides
    title: 補助ガイド
    group: 道具
    summary: 演習そのものではないが、あると進めやすくなるもの。
    pages:
      - materials/tools/opencode.md

# nav.yaml の外で生成されるページへの上部メニューのリンク。
# url はサイトルートからの相対パス。
external_links:
  - title: 補助ツール
    url: tools/
    group: 道具
