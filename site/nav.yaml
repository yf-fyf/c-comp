# サイト構成の単一の出典。
#
# tools/build_site.py がこのファイルを読んで、全ページの HTML・上部メニュー・
# 前後ナビ・トップページを生成する。教材を追加・改名したときはここに1行足す。
#
# 各ページのタイトルは原稿の先頭 H1 から取るので、ここには書かない。
# 出力先は <section slug>/<原稿の stem>/index.html。
# stem が README のものだけは <section slug>/index.html（セクションの入口）になる。

title: 実践・C コンパイラ演習
description: C 言語サブセットのコンパイラを段階的に作る演習教材。RISC-V RV64 を qemu で動かす。
base_url: https://yf-fyf.github.io/c-comp/
repo_url: https://github.com/yf-fyf/c-comp
repo_branch: dev

# サイト内に無い Markdown へのリンクは repo_url/blob/repo_branch/<path> へ逃がす。

sections:
  - slug: sessions
    title: 通常回
    summary: コマ1〜16（07 は欠番）の15コマ。読んで実装し、その日のうちに動かして確認する粒度に分けてある。
    pages:
      - materials/sessions/01_environment.md
      - materials/sessions/02_interpreter.md
      - materials/sessions/03_arithmetic_codegen.md
      - materials/sessions/04_variables.md
      - materials/sessions/05_if_else.md
      - materials/sessions/06_loops.md
      - materials/sessions/08_functions_recursion.md
      - materials/sessions/09_lvalue_rvalue.md
      - materials/sessions/10_types_pointers.md
      - materials/sessions/11_strings_printf.md
      - materials/sessions/12_struct.md
